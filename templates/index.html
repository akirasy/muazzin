<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Muazzin Status</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <meta http-equiv="refresh" content="60">
</head>
<body class="bg-gray-100 text-gray-800 font-sans p-8">
    <div class="max-w-4xl mx-auto">
        <h1 class="text-4xl font-bold text-center text-gray-900 mb-8">Muazzin Status</h1>

        <div class="bg-white shadow-md rounded-lg p-6 mb-8">
            <h2 class="text-2xl font-semibold text-gray-700 mb-4">Prayer Times</h2>
            <p class="text-sm text-gray-500 mb-4">Last updated: {{ last_updated }}</p>
            <div class="overflow-x-auto">
                <table class="min-w-full bg-white">
                    <thead class="bg-gray-200">
                        <tr>
                            <th class="w-1/2 py-3 px-4 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Prayer</th>
                            <th class="w-1/2 py-3 px-4 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Time</th>
                        </tr>
                    </thead>
                    <tbody class="divide-y divide-gray-200">
                        {% for prayer, time in prayer_times.items() %}
                        <tr class="hover:bg-gray-50">
                            <td class="py-4 px-4 whitespace-nowrap">{{ prayer }}</td>
                            <td class="py-4 px-4 whitespace-nowrap">{{ time }}</td>
                        </tr>
                        {% endfor %}
                    </tbody>
                </table>
            </div>
        </div>

        <div class="bg-white shadow-md rounded-lg p-6">
            <h2 class="text-2xl font-semibold text-gray-700 mb-4">Log File</h2>
            <pre class="bg-gray-800 text-white p-4 rounded-lg overflow-x-auto"><code>{{ log_content }}</code></pre>
        </div>
    </div>
</body>
</html>
